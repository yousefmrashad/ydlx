[project]
name = "yt-dlp-int"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.26.8",
    "yt-dlp>=2026.7.4",
    "rich>=13.7.0",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
]

[project.scripts]
yt-dlp-int = "main:app"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
exclude = [
    "build",
    ".venv",
]
