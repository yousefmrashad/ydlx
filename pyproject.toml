[project]
name = "ydlx"
version = "0.2.0"
description = "An interactive, feature-rich CLI dashboard and downloader for yt-dlp"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=v0.27.2",
    "yt-dlp>=v2026.8.19",
    "rich>=13.7.0",
    "curl-cffi>=0.5.10,!=0.6.*,!=0.7.*,!=0.8.*,!=0.9.*,<0.17",
]

authors = [{ name = "Yousef Rashad", email = "yousefmrashad@proton.me" }]

[project.urls]
Homepage = "https://github.com/yousefmrashad/ydlx"
Repository = "https://github.com/yousefmrashad/ydlx"
Issues = "https://github.com/yousefmrashad/ydlx/issues"

[project.scripts]
ydlx = "ydlx:app"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
exclude = [
    "build",
    ".venv",
]
