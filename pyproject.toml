[project]
name = "ydlx"
version = "0.6.0"
description = "An interactive, feature-rich CLI dashboard and downloader for yt-dlp"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=v0.27.2",
    "yt-dlp>=v2026.8.19",
    "rich>=13.7.0",
    "curl-cffi>=0.5.10,!=0.6.*,!=0.7.*,!=0.8.*,!=0.9.*,<0.17",
]

authors = [{ name = "Yousef Rashad", email = "yousefmrashad@proton.me" }]

[project.urls]
Homepage = "https://github.com/yousefmrashad/ydlx"
Repository = "https://github.com/yousefmrashad/ydlx"
Issues = "https://github.com/yousefmrashad/ydlx/issues"

[project.scripts]
ydlx = "ydlx:app"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15", "basedpyright>=1.31"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # Let the formatter handle long lines automatically
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
