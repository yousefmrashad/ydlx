[project]
name = "ydlx"
version = "0.1.0"
description = "An interactive, feature-rich CLI dashboard and downloader for yt-dlp"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.26.8",
    "yt-dlp>=2026.7.4",
    "rich>=13.7.0",
    "curl-cffi>=0.7.0",
]

[project.scripts]
ydlx = "main:app"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
exclude = [
    "build",
    ".venv",
]
